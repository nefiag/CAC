name: boshite-ledger-cod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coxiaoac_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: coxiaoac
    volumes:
      - coxiaoac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coxiaoac_user -d coxiaoac"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://coxiaoac_user:${POSTGRES_PASSWORD}@db:5432/coxiaoac
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LEDGER_BACKUP_DIR: /var/lib/coxiaoac/backups
      LEDGER_BACKUP_RECORD_DIR: ${LEDGER_BACKUP_RECORD_DIR:-/home/ubuntu/Coxiaoac/private-backups/ledger}
    volumes:
      - ./private-backups/ledger:/var/lib/coxiaoac/backups
    expose: ["8000"]
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    expose: ["80"]
    ports:
      - "127.0.0.1:18810:80"
    networks: [internal]

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [frontend]
    networks: [internal]

networks:
  internal:

volumes:
  coxiaoac_pgdata:
