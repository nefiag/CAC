services:
  db:
    image: postgres:15-alpine
    container_name: coxiaoac_db
    restart: always
    environment:
      POSTGRES_USER: coxiaoac_user
      POSTGRES_PASSWORD: coxiaoac_password
      POSTGRES_DB: coxiaoac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coxiaoac_user -d coxiaoac"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: coxiaoac_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://coxiaoac_user:coxiaoac_password@db:5432/coxiaoac
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: coxiaoac_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
